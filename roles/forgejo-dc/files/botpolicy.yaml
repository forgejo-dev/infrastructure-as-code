bots:
    - name: registration
      path_regex: ^/user/sign_up
      action: CHALLENGE
      challenge:
          difficulty: 4
          report_as: 4
          algorithm: fast

    - import: (data)/bots/_deny-pathological.yaml
    - import: (data)/bots/aggressive-brazilian-scrapers.yaml
    - import: (data)/meta/ai-block-aggressive.yaml

    ### anubis primarily protects URLs that should not be accessed by regular bots anyway
    - import: (data)/crawlers/_allow-good.yaml

    - import: (data)/clients/x-firefox-ai.yaml
    - import: (data)/common/keep-internet-working.yaml

    - name: generic-browser
      user_agent_regex: >-
        Mozilla|Opera
      action: WEIGH
      weight:
        adjust: 10

    - name: session-token
      action: WEIGH
      expression:
        all:
          - '"Cookie" in headers'
          - 'headers["Cookie"].contains("i_like_gitea=")'
      weight:
        adjust: -5 # Allow nojs challenge.

dnsbl: false

status_codes:
  CHALLENGE: 200
  DENY: 200

thresholds:
  - name: no-suspicion
    expression: weight <= 0 # If no rule flagged the request, then do not issue a challenge.
    action: ALLOW
  - name: mild-suspicion
    expression:
      all:
        - weight > 0
        - weight < 10
    action: CHALLENGE
    challenge:
      algorithm: metarefresh
      difficulty: 1
      report_as: 1
  - name: moderate-suspicion
    expression:
      all:
        - weight >= 10
        - weight < 20
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 2
      report_as: 2
  - name: extreme-suspicion
    expression: weight >= 20
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 4
      report_as: 4
